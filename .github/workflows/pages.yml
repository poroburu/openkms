# Publish the openKMS website to GitHub Pages.
#
# The site is a hybrid: a bespoke Tailwind-powered landing page at
# `website/src/pages/index.astro` (served at `/openkms/`) plus the
# Astro/Starlight docs collection under `website/src/content/docs/`.
# `npm run build` produces both in `website/dist/`.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "website/**"
      - "openapi/**"
      - "README.md"
      - "docs/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Verify landing page and docs rendered
        working-directory: website
        run: |
          set -euo pipefail

          # Bespoke landing page lives at /openkms/ → dist/index.html
          test -f dist/index.html
          grep -q "Your trading agent shouldn't hold your" dist/index.html
          grep -q "Run it on a Pi today" dist/index.html
          grep -q "/sign/solana" dist/index.html
          grep -q "openclaw-heading" dist/index.html
          grep -q "comparison-heading" dist/index.html

          # Tailwind preflight must stay scoped to the landing page only.
          # Docs pages are emitted by Starlight and must not import the
          # marketing stylesheet.
          test -f dist/overview/index.html
          test -f dist/reference/http-api/index.html
          if grep -q "index@_@astro" dist/overview/index.html; then
            echo "Marketing stylesheet leaked into Starlight docs page" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
