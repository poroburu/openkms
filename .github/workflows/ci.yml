# Fast repo checks. Validates vault drivers, config/docs drift, OpenAPI, and
# mock-vault smoke scripts without a remote staging host. Real-hardware smoke
# stays in remote-e2e.yml (workflow_dispatch only).
# To exercise only the ignored shell test locally, run:
#   cargo test --test remote_e2e_job_shell -- --ignored --nocapture
name: Repo Checks

on:
  push:
    paths:
      - ".cargo/**"
      - ".agents/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "deploy/**"
      - "openapi/**"
      - "brand/**"
      - "website/**"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: Run tests (ignored mock-vault shell test runs in smoke-mock-vault job)
        run: cargo test --all-targets

      - name: Vault driver unit tests
        run: cargo test --lib vault::

  docs:
    name: Docs + website
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: Docs drift (example config, vault pages, README index)
        run: cargo test --test docs_drift

      - name: Build rustdoc with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

      - name: Check generated OpenAPI drift
        run: |
          cargo run --bin generate_openapi > /tmp/openkms.v1.json
          diff -u openapi/openkms.v1.json /tmp/openkms.v1.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

  smoke-mock-vault:
    name: Smoke scripts (mock vault)
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: run_remote_e2e_job.sh against in-process mock vault HTTP signer
        run: cargo test --test remote_e2e_job_shell -- --ignored --nocapture
