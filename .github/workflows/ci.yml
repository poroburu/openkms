# Fast repo checks. `lint` → `test` → `remote-e2e-job-shell` chain reuses rust-cache
# via shared-key `openkms`. To exercise only the ignored shell test locally, run:
#   cargo test --test remote_e2e_job_shell -- --ignored --nocapture
name: Repo Checks

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/run_remote_e2e_job.sh"
      - "scripts/remote_e2e_smoke.sh"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: openkms

      - name: Run tests (ignored remote shell test runs in its own job)
        run: cargo test --all-targets

  remote-e2e-job-shell:
    name: Remote E2E job script (mock signer)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: openkms

      - name: run_remote_e2e_job.sh against in-process mock HTTP signer
        run: cargo test --test remote_e2e_job_shell -- --ignored --nocapture
