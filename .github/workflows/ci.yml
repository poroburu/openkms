# Fast repo checks. lint -> test -> remote-e2e-job-shell reuses rust-cache
# via shared-key `openkms`. rust-cache pinned to v2.9.1 (`runs.using: node24`; upgrade
# gh act if local runs fail to load the action).
# To exercise only the ignored shell test locally, run:
#   cargo test --test remote_e2e_job_shell -- --ignored --nocapture
name: Repo Checks

on:
  push:
    paths:
      - ".cargo/**"
      - ".agents/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "deploy/**"
      - "openapi/**"
      - "website/**"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: Run tests (ignored remote shell test runs in its own job)
        run: cargo test --all-targets

  docs:
    name: Docs + website
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: Build rustdoc with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

      - name: Check generated OpenAPI drift
        run: |
          cargo run --bin generate_openapi > /tmp/openkms.v1.json
          diff -u openapi/openkms.v1.json /tmp/openkms.v1.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

  remote-e2e-job-shell:
    name: Remote E2E job script (mock signer)
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: openkms

      - name: run_remote_e2e_job.sh against in-process mock HTTP signer
        run: cargo test --test remote_e2e_job_shell -- --ignored --nocapture
