# Staging smoke against a real deployment. Each job joins your tailnet first
# (`tailscale/github-action`), then runs the same shell entrypoint as operators
# (`scripts/run_remote_e2e_job.sh`). Set `OPENKMS_BASE_URL` to a URL reachable on
# the tailnet (e.g. http://signer-hostname:8443). See docs/remote-e2e.md.
#
# Tailscale: OAuth client (recommended) — secrets TAILSCALE_OAUTH_CLIENT_ID,
#   TAILSCALE_OAUTH_CLIENT_SECRET; repo var TAILSCALE_OAUTH_TAGS (default tag:ci if unset).
#   Optional secret OPENKMS_TAILSCALE_PING_HOST — see comment on Tailscale step.
# openKMS smoke secrets: OPENKMS_BASE_URL, OPENKMS_SIGNER_TOKEN,
#   OPENKMS_REMOTE_E2E_SOLANA_REQUEST_B64, OPENKMS_REMOTE_E2E_COSMOS_REQUEST_B64
# Optional repo vars: OPENKMS_EXPECT_SOLANA_KEY_LABEL, OPENKMS_EXPECT_COSMOS_KEY_LABEL
#
# DISABLED for automatic CI: only `workflow_dispatch` until you enable production
# staging gates. To run on every push to main, add under `on:`:
#   push:
#     branches: [main]
# (and optionally `concurrency:` to cancel in-progress runs). Mock signing smoke
# for scripts stays in `ci.yml` → job `remote-e2e-job-shell`.
#
# Without Tailscale, curl would originate from GitHub’s public runner IPs — see
# docs/remote-e2e.md (nginx + deploy/nginx-openkms-remote-e2e.conf.example, or
# systemd drop-in for api.github.com/meta `actions` CIDRs).
#
# Local `act` / `gh act`: `ACT=true` skips the Tailscale step (tailscaled often fails
# to become healthy inside the act container). Point OPENKMS_BASE_URL at the host from
# the container (e.g. host.docker.internal) — see docs/remote-e2e.md.
name: Remote E2E

on:
  workflow_dispatch:

jobs:
  solana:
    name: Remote smoke (Solana)
    runs-on: ubuntu-latest
    env:
      OPENKMS_BASE_URL: ${{ secrets.OPENKMS_BASE_URL }}
      OPENKMS_SIGNER_TOKEN: ${{ secrets.OPENKMS_SIGNER_TOKEN }}
      OPENKMS_SIGN_REQUEST_B64: ${{ secrets.OPENKMS_REMOTE_E2E_SOLANA_REQUEST_B64 }}
      OPENKMS_EXPECT_KEY_LABEL: ${{ vars.OPENKMS_EXPECT_SOLANA_KEY_LABEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Ping: optional. After `tailscale up`, the action runs `tailscale ping` on this
      # host (MagicDNS name, e.g. my-pi, or a 100.x tailnet IP) until it succeeds — same
      # machine as OPENKMS_BASE_URL is fine. Leave secret unset to skip waiting.
      - name: Tailscale
        if: ${{ env.ACT != 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: ${{ vars.TAILSCALE_OAUTH_TAGS || 'tag:ci' }}
          ping: ${{ secrets.OPENKMS_TAILSCALE_PING_HOST }}

      - name: Remote smoke (Solana)
        run: |
          chmod +x ./scripts/run_remote_e2e_job.sh ./scripts/remote_e2e_smoke.sh
          ./scripts/run_remote_e2e_job.sh solana

  cosmos:
    name: Remote smoke (Cosmos)
    runs-on: ubuntu-latest
    env:
      OPENKMS_BASE_URL: ${{ secrets.OPENKMS_BASE_URL }}
      OPENKMS_SIGNER_TOKEN: ${{ secrets.OPENKMS_SIGNER_TOKEN }}
      OPENKMS_SIGN_REQUEST_B64: ${{ secrets.OPENKMS_REMOTE_E2E_COSMOS_REQUEST_B64 }}
      OPENKMS_EXPECT_KEY_LABEL: ${{ vars.OPENKMS_EXPECT_COSMOS_KEY_LABEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same Tailscale + optional ping as Solana job (separate runner).
      - name: Tailscale
        if: ${{ env.ACT != 'true' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: ${{ vars.TAILSCALE_OAUTH_TAGS || 'tag:ci' }}
          ping: ${{ secrets.OPENKMS_TAILSCALE_PING_HOST }}

      - name: Remote smoke (Cosmos)
        run: |
          chmod +x ./scripts/run_remote_e2e_job.sh ./scripts/remote_e2e_smoke.sh
          ./scripts/run_remote_e2e_job.sh cosmos
